<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #00f2ff; --bg: #050505; --card: #111; --neon: #0f0; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; margin: 0; padding: 10px; }
        
        nav { border-bottom: 2px solid var(--main); padding: 10px 15px; display: flex; justify-content: space-between; background: #000; align-items: center; }
        .status { color: var(--neon); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* PERFIL / USERNAME */
        .user-bar { background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; margin: 10px 0; display: flex; gap: 8px; align-items: center; font-size: 11px; }
        .user-bar input { flex: 1; padding: 6px; background: #000; border: 1px solid var(--main); color: #fff; border-radius: 4px; font-family: monospace; font-size: 11px; }
        .user-bar button { background: var(--main); color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        /* GRID DE SELEÇÃO */
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 10px 0; }
        .game-card { background: var(--card); border: 2px solid #222; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: var(--main); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .game-card h3 { margin: 10px 0 5px 0; font-size: 16px; }
        .game-card span { font-size: 10px; color: #555; text-transform: uppercase; }
        .icon { font-size: 35px; }

        /* PLACAR GLOBAL */
        .ranking-box { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 10px; margin-top: 15px; }
        .ranking-box h4 { margin: 0 0 8px 0; color: #ff5722; font-size: 12px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .ranking-item { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed #1a1a1a; }

        /* VIEWPORT DE JOGO */
        #SISTEMA_VIEWPORT { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #SISTEMA_CONTAINER { width: 100%; height: 100%; }
        .BTN-CLOSE { position: absolute; top: 15px; right: 15px; background: #ff0055; color: white; border: none; padding: 8px 15px; cursor: pointer; z-index: 100000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 14px; color: var(--main);">CORE_OS // CLIENTE</div>
        <div class="status" id="peer-status">CONECTANDO...</div>
    </nav>

    <div class="user-bar">
        <span>👤 Nick:</span>
        <input type="text" id="input-username" placeholder="Digite seu usuário...">
        <button onclick="salvarUsername()">Salvar</button>
    </div>

    <div class="container">
        <div class="game-card" onclick="BOOT_GAME('B2_NEON_STACK')">
            <div class="icon">🧱</div>
            <h3>NEON STACK 3D</h3>
            <span>JOGAR & PONTUAR</span>
        </div>
    </div>

    <div class="ranking-box">
        <h4>🏆 Placar Global Online</h4>
        <div id="feed-ranking">Aguardando dados da rede...</div>
    </div>

    <div id="SISTEMA_VIEWPORT">
        <button class="BTN-CLOSE" onclick="SHUTDOWN()">✕ SAIR DO JOGO</button>
        <div id="SISTEMA_CONTAINER"></div>
    </div>

    <script>
        const ID_SALA = "core_os_hub_2026";
        let peer, conexaoAtiva;
        let username = localStorage.getItem('core_os_username') || "";
        let rankingCache = JSON.parse(localStorage.getItem('core_os_client_ranking')) || [];

        document.getElementById('input-username').value = username;

        if (rankingCache.length > 0) {
            renderizarRanking(rankingCache);
        }

        function salvarUsername() {
            const val = document.getElementById('input-username').value.trim();
            if(!val) { alert("Insira um nome válido!"); return; }
            username = val;
            localStorage.setItem('core_os_username', username);
            alert("Nome salvo com sucesso!");
        }

        function iniciarCliente() {
            if (peer) { try { peer.destroy(); } catch(e) {} }

            peer = new Peer(undefined, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                document.getElementById('peer-status').innerText = "ONLINE";
                conectarAoHost();
            });

            peer.on('error', () => {
                document.getElementById('peer-status').innerText = "REENCONTRANDO...";
                setTimeout(iniciarCliente, 5000);
            });
        }

        function conectarAoHost() {
            conexaoAtiva = peer.connect(ID_SALA);

            conexaoAtiva.on('open', () => {
                document.getElementById('peer-status').innerText = "CONECTADO AO HOST ⚡";
            });

            conexaoAtiva.on('data', (data) => {
                if (data.tipo === "ranking") {
                    rankingCache = data.ranking;
                    localStorage.setItem('core_os_client_ranking', JSON.stringify(rankingCache));
                    renderizarRanking(rankingCache);
                }
            });

            conexaoAtiva.on('close', () => {
                document.getElementById('peer-status').innerText = "HOST QUEDOU, RECONECTANDO...";
                setTimeout(conectarAoHost, 4000);
            });

            conexaoAtiva.on('error', () => {
                setTimeout(conectarAoHost, 4000);
            });
        }

        function enviarPontuacao(jogo, pontos) {
            if (!username) {
                username = "Convidado_" + Math.floor(Math.random() * 1000);
                localStorage.setItem('core_os_username', username);
                document.getElementById('input-username').value = username;
            }

            if (conexaoAtiva && conexaoAtiva.open) {
                conexaoAtiva.send({
                    tipo: "atualizar_pontos",
                    usuario: username,
                    jogo: jogo,
                    pontos: pontos
                });
            }
        }

        function renderizarRanking(lista) {
            const box = document.getElementById('feed-ranking');
            if(!lista || lista.length === 0) {
                box.innerHTML = "<div style='color:#555; font-size:10px;'>Nenhum recorde cadastrado.</div>";
                return;
            }
            box.innerHTML = lista.map(r => `
                <div class="ranking-item">
                    <span><b>${r.usuario}</b> (${r.jogo})</span>
                    <span style="color:#00ff88;">${r.pontos} pts</span>
                </div>
            `).join('');
        }

        /* --- BANCO DE DADOS DOS JOGOS INTEGRADOS COM ENVIO DE PONTOS --- */
        const SISTEMA_DE_ARQUIVOS = {
            "B2_NEON_STACK": `
                <!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><style>body { margin: 0; overflow: hidden; background-color: #050508; font-family: sans-serif; user-select: none; } #ui { position: absolute; top: 50px; width: 100%; text-align: center; color: #ffffff; pointer-events: none; z-index: 10; } #score { font-size: 80px; font-weight: 900; margin: 0; text-shadow: 0 0 20px #0ff; } .label { font-size: 14px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.6; } #instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; color: white; font-size: 12px; letter-spacing: 2px; opacity: 0.4; }</style></head><body><div id="ui"><div class="label">Altitude</div><h1 id="score">0</h1></div><div id="instructions">CLIQUE PARA EMPILHAR</div><script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }<\/script><script type="module">import * as THREE from 'three'; const scene = new THREE.Scene(); const aspect = window.innerWidth / window.innerHeight; const d = 20; const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000); camera.position.set(20, 20, 20); camera.lookAt(0, 0, 0); const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); document.body.appendChild(renderer.domElement); scene.add(new THREE.AmbientLight(0xffffff, 0.4)); const mainLight = new THREE.DirectionalLight(0xffffff, 1.2); mainLight.position.set(10, 20, 15); scene.add(mainLight); let stack = []; let gameActive = true; let speed = 0.3; let direction = 'x'; let moveDir = 1; function createBox(x, y, z, w, d, color) { const geometry = new THREE.BoxGeometry(w, 1, d); const material = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.2 }); const mesh = new THREE.Mesh(geometry, material); mesh.position.set(x, y, z); scene.add(mesh); return { mesh, w, d }; } const base = createBox(0, 0, 0, 12, 12, 0x00f3ff); stack.push(base); function spawn() { const prev = stack[stack.length - 1]; const hue = (stack.length * 15) % 360; const color = new THREE.Color(\`hsl(\${hue}, 80%, 55%)\`); direction = direction === 'x' ? 'z' : 'x'; const x = direction === 'x' ? -20 : prev.mesh.position.x; const z = direction === 'z' ? -20 : prev.mesh.position.z; stack.push(createBox(x, stack.length, z, prev.w, prev.d, color)); } spawn(); function animate() { if (gameActive) { const current = stack[stack.length - 1]; if (direction === 'x') { current.mesh.position.x += speed * moveDir; if (Math.abs(current.mesh.position.x) > 20) moveDir *= -1; } else { current.mesh.position.z += speed * moveDir; if (Math.abs(current.mesh.position.z) > 20) moveDir *= -1; } camera.position.y = THREE.MathUtils.lerp(camera.position.y, stack.length + 15, 0.08); camera.lookAt(0, stack.length - 2, 0); } renderer.render(scene, camera); requestAnimationFrame(animate); } window.onmousedown = () => { if (!gameActive) { location.reload(); return; } const current = stack[stack.length - 1]; const prev = stack[stack.length - 2]; const delta = direction === 'x' ? current.mesh.position.x - prev.mesh.position.x : current.mesh.position.z - prev.mesh.position.z; const size = direction === 'x' ? current.w : current.d; const overlap = size - Math.abs(delta); if (overlap <= 0) { gameActive = false; document.getElementById('score').style.color = '#f05'; } else { if (direction === 'x') { current.mesh.scale.x = overlap / current.w; current.mesh.position.x -= delta / 2; current.w = overlap; } else { current.mesh.scale.z = overlap / current.d; current.mesh.position.z -= delta / 2; current.d = overlap; } const finalScore = stack.length - 1; document.getElementById('score').innerText = finalScore; window.parent.enviarPontuacao('NEON_STACK', finalScore); speed += 0.01; spawn(); } }; animate();<\/script></body></html>
            `
        };

        function BOOT_GAME(id) {
            const viewport = document.getElementById('SISTEMA_VIEWPORT');
            const container = document.getElementById('SISTEMA_CONTAINER');
            viewport.style.display = 'block';
            
            const iframe = document.createElement('iframe');
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            
            container.innerHTML = "";
            container.appendChild(iframe);
            
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(SISTEMA_DE_ARQUIVOS[id]);
            doc.close();
        }

        function SHUTDOWN() {
            document.getElementById('SISTEMA_VIEWPORT').style.display = 'none';
            document.getElementById('SISTEMA_CONTAINER').innerHTML = '';
        }

        iniciarCliente();
    </script>
</body>
</html>
