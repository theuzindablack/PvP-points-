<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --main: #00f2ff; --bg: #050505; --card: #111; --neon: #0f0; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; margin: 0; padding: 10px; -webkit-tap-highlight-color: transparent; }
        
        nav { border-bottom: 2px solid var(--main); padding: 10px 15px; display: flex; justify-content: space-between; background: #000; align-items: center; }
        .status { color: var(--neon); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }

        .user-bar { background: #111; border: 1px solid #333; padding: 10px; border-radius: 8px; margin: 10px 0; display: flex; gap: 8px; align-items: center; font-size: 11px; }
        .user-bar input { flex: 1; padding: 6px; background: #000; border: 1px solid var(--main); color: #fff; border-radius: 4px; font-family: monospace; font-size: 11px; outline: none; }
        .user-bar button { background: var(--main); color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; padding: 10px 0; }
        .game-card { background: var(--card); border: 2px solid #222; border-radius: 10px; padding: 15px; text-align: center; cursor: pointer; transition: 0.3s; }
        .game-card:hover { border-color: var(--main); box-shadow: 0 0 15px rgba(0, 242, 255, 0.3); }
        .game-card h3 { margin: 10px 0 5px 0; font-size: 16px; }
        .game-card span { font-size: 10px; color: #555; text-transform: uppercase; }
        .icon { font-size: 35px; }

        .ranking-box { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 10px; margin-top: 15px; }
        .ranking-box h4 { margin: 0 0 8px 0; color: #ff5722; font-size: 12px; border-bottom: 1px solid #222; padding-bottom: 4px; }
        .ranking-item { display: flex; justify-content: space-between; font-size: 11px; padding: 4px 0; border-bottom: 1px dashed #1a1a1a; }

        #SISTEMA_VIEWPORT { display: none; position: fixed; inset: 0; background: #000; z-index: 99999; }
        #SISTEMA_CONTAINER { width: 100%; height: 100%; }
        .BTN-CLOSE { position: absolute; top: 15px; right: 15px; background: #ff0055; color: white; border: none; padding: 8px 15px; cursor: pointer; z-index: 100000; font-weight: bold; border-radius: 5px; }
    </style>
</head>
<body>

    <nav>
        <div style="font-weight: 900; letter-spacing: 2px; font-size: 14px; color: var(--main);">CORE_OS // CLIENTE</div>
        <div class="status" id="peer-status">CONECTANDO...</div>
    </nav>

    <div class="user-bar">
        <span>👤 Nick:</span>
        <input type="text" id="input-username" placeholder="Digite seu usuário...">
        <button onclick="salvarUsername()">Salvar</button>
    </div>

    <div class="container">
        <div class="game-card" onclick="BOOT_GAME('B2_NEON_STACK')">
            <div class="icon">🧱</div>
            <h3>NEON STACK 3D</h3>
            <span>JOGAR & PONTUAR</span>
        </div>
    </div>

    <div class="ranking-box">
        <h4>🏆 Placar Global Online</h4>
        <div id="feed-ranking">Aguardando dados da rede...</div>
    </div>

    <div id="SISTEMA_VIEWPORT">
        <button class="BTN-CLOSE" onclick="SHUTDOWN()">✕ SAIR DO JOGO</button>
        <div id="SISTEMA_CONTAINER"></div>
    </div>

    <script>
        const ID_SALA = "core_os_hub_2026";
        let peer, conexaoAtiva;
        let username = localStorage.getItem('core_os_username') || "";
        let rankingCache = JSON.parse(localStorage.getItem('core_os_client_ranking')) || [];
        let pontuacoesPendentes = JSON.parse(localStorage.getItem('core_os_pendentes')) || [];

        document.getElementById('input-username').value = username;
        if (rankingCache.length > 0) renderizarRanking(rankingCache);

        function salvarUsername() {
            const val = document.getElementById('input-username').value.trim();
            if(!val) { alert("Insira um nome válido!"); return; }
            username = val;
            localStorage.setItem('core_os_username', username);
            alert("Nome salvo com sucesso!");
        }

        function iniciarCliente() {
            if (peer) { try { peer.destroy(); } catch(e) {} }

            peer = new Peer(undefined, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', () => {
                document.getElementById('peer-status').innerText = "ONLINE";
                conectarAoHost();
            });

            peer.on('error', () => {
                document.getElementById('peer-status').innerText = "OFFLINE (Modo Local)";
                setTimeout(iniciarCliente, 5000);
            });
        }

        function conectarAoHost() {
            conexaoAtiva = peer.connect(ID_SALA);

            conexaoAtiva.on('open', () => {
                document.getElementById('peer-status').innerText = "CONECTADO AO HOST ⚡";
                sincronizarPendencias();
            });

            conexaoAtiva.on('data', (data) => {
                if (data.tipo === "ranking") {
                    rankingCache = data.ranking;
                    localStorage.setItem('core_os_client_ranking', JSON.stringify(rankingCache));
                    renderizarRanking(rankingCache);
                } else if (data.tipo === "confirmacao_pontos") {
                    pontuacoesPendentes = pontuacoesPendentes.filter(p => !(p.jogo === data.jogo && p.pontos === data.pontos));
                    localStorage.setItem('core_os_pendentes', JSON.stringify(pontuacoesPendentes));
                }
            });

            conexaoAtiva.on('close', () => {
                document.getElementById('peer-status').innerText = "HOST QUEDOU (Modo Local)";
                setTimeout(conectarAoHost, 4000);
            });

            conexaoAtiva.on('error', () => {
                setTimeout(conectarAoHost, 4000);
            });
        }

        function enviarPontuacao(jogo, pontos) {
            if (!username) {
                username = "Convidado_" + Math.floor(Math.random() * 1000);
                localStorage.setItem('core_os_username', username);
                document.getElementById('input-username').value = username;
            }

            const payload = {
                tipo: "atualizar_pontos",
                usuario: username,
                jogo: jogo,
                pontos: pontos
            };

            if (!pontuacoesPendentes.some(p => p.jogo === jogo && p.pontos === pontos)) {
                pontuacoesPendentes.push(payload);
                localStorage.setItem('core_os_pendentes', JSON.stringify(pontuacoesPendentes));
            }

            sincronizarPendencias();
        }

        function sincronizarPendencias() {
            if (conexaoAtiva && conexaoAtiva.open && pontuacoesPendentes.length > 0) {
                pontuacoesPendentes.forEach(payload => {
                    conexaoAtiva.send(payload);
                });
            }
        }

        function renderizarRanking(lista) {
            const box = document.getElementById('feed-ranking');
            if(!lista || lista.length === 0) {
                box.innerHTML = "<div style='color:#555; font-size:10px;'>Nenhum recorde cadastrado.</div>";
                return;
            }
            box.innerHTML = lista.map(r => `
                <div class="ranking-item">
                    <span><b>${r.usuario}</b> (${r.jogo})</span>
                    <span style="color:#00ff88;">${r.pontos} pts</span>
                </div>
            `).join('');
        }

        const SISTEMA_DE_ARQUIVOS = {
            "B2_NEON_STACK": `
                <!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><style>
                body { margin: 0; overflow: hidden; background-color: #050508; font-family: sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: pointer; } 
                #ui { position: absolute; top: 50px; width: 100%; text-align: center; color: #ffffff; pointer-events: none; z-index: 10; } 
                #score { font-size: 80px; font-weight: 900; margin: 0; text-shadow: 0 0 20px #0ff; } 
                .label { font-size: 14px; letter-spacing: 5px; text-transform: uppercase; opacity: 0.6; } 
                #instructions { position: absolute; bottom: 30px; width: 100%; text-align: center; color: white; font-size: 12px; letter-spacing: 2px; opacity: 0.4; pointer-events: none; }
                
                #gameover-screen {
                    display: none;
                    position: absolute;
                    inset: 0;
                    background: rgba(0, 0, 0, 0.85);
                    z-index: 100;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    gap: 15px;
                    pointer-events: auto;
                }
                #gameover-screen h1 { color: #ff0055; font-size: 32px; margin: 0 0 5px 0; text-shadow: 0 0 15px rgba(255,0,85,0.5); }
                .btn-game {
                    background: #00f2ff;
                    color: #000;
                    border: none;
                    padding: 12px 24px;
                    font-size: 14px;
                    font-weight: bold;
                    border-radius: 6px;
                    cursor: pointer;
                    font-family: 'Courier New', monospace;
                    box-shadow: 0 0 15px rgba(0,242,255,0.4);
                    width: 220px;
                }
                .btn-game.sair {
                    background: #222;
                    color: #fff;
                    border: 1px solid #444;
                    box-shadow: none;
                }
                </style></head><body>
                <div id="ui"><div class="label">Altitude</div><h1 id="score">0</h1></div>
                <div id="instructions">TOQUE PARA EMPILHAR</div>
                
                <div id="gameover-screen">
                    <h1>FIM DE JOGO</h1>
                    <p style="color: #aaa; font-size: 13px; margin: 0 0 10px 0;">Pontuação salva com sucesso!</p>
                    <button class="btn-game" onclick="reiniciarJogo()">🔄 TENTAR DE NOVO</button>
                    <button class="btn-game sair" onclick="sairDoJogo()">✕ SAIR PARA O HUB</button>
                </div>

                <script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }<\/script>
                <script type="module">
                import * as THREE from 'three'; 

                let scene, camera, renderer;
                let stack = []; 
                let gameActive = true; 
                let speed = 0.3; 
                let direction = 'x'; 
                let moveDir = 1; 
                let animationFrameId = null;

                function initGame() {
                    // Limpa cena anterior se houver
                    if (renderer) {
                        renderer.dispose();
                        document.body.removeChild(renderer.domElement);
                    }

                    scene = new THREE.Scene(); 
                    const aspect = window.innerWidth / window.innerHeight; 
                    const d = 20; 
                    camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 1000); 
                    camera.position.set(20, 20, 20); 
                    camera.lookAt(0, 0, 0); 
                    
                    renderer = new THREE.WebGLRenderer({ antialias: true }); 
                    renderer.setSize(window.innerWidth, window.innerHeight); 
                    document.body.appendChild(renderer.domElement); 
                    
                    scene.add(new THREE.AmbientLight(0xffffff, 0.4)); 
                    const mainLight = new THREE.DirectionalLight(0xffffff, 1.2); 
                    mainLight.position.set(10, 20, 15); 
                    scene.add(mainLight); 

                    stack = [];
                    gameActive = true;
                    speed = 0.3;
                    direction = 'x';
                    moveDir = 1;

                    document.getElementById('score').innerText = '0';
                    document.getElementById('score').style.color = '#ffffff';
                    document.getElementById('gameover-screen').style.display = 'none';

                    const base = createBox(0, 0, 0, 12, 12, 0x00f3ff); 
                    stack.push(base); 
                    spawn();
                    
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    animate();
                }
                
                function createBox(x, y, z, w, d, color) { 
                    const geometry = new THREE.BoxGeometry(w, 1, d); 
                    const material = new THREE.MeshPhongMaterial({ color, emissive: color, emissiveIntensity: 0.2 }); 
                    const mesh = new THREE.Mesh(geometry, material); 
                    mesh.position.set(x, y, z); 
                    scene.add(mesh); 
                    return { mesh, w, d }; 
                } 
                
                function spawn() { 
                    const prev = stack[stack.length - 1]; 
                    const hue = (stack.length * 15) % 360; 
                    const color = new THREE.Color(\`hsl(\${hue}, 80%, 55%)\`); 
                    direction = direction === 'x' ? 'z' : 'x'; 
                    const x = direction === 'x' ? -20 : prev.mesh.position.x; 
                    const z = direction === 'z' ? -20 : prev.mesh.position.z; 
                    stack.push(createBox(x, stack.length, z, prev.w, prev.d, color)); 
                } 
                
                function animate() { 
                    if (gameActive) { 
                        const current = stack[stack.length - 1]; 
                        if (direction === 'x') { 
                            current.mesh.position.x += speed * moveDir; 
                            if (Math.abs(current.mesh.position.x) > 20) moveDir *= -1; 
                        } else { 
                            current.mesh.position.z += speed * moveDir; 
                            if (Math.abs(current.mesh.position.z) > 20) moveDir *= -1; 
                        } 
                        camera.position.y = THREE.MathUtils.lerp(camera.position.y, stack.length + 15, 0.08); 
                        camera.lookAt(0, stack.length - 2, 0); 
                    } 
                    renderer.render(scene, camera); 
                    animationFrameId = requestAnimationFrame(animate); 
                } 
                
                function action(e) { 
                    if (!gameActive) return; 
                    
                    const current = stack[stack.length - 1]; 
                    const prev = stack[stack.length - 2]; 
                    const delta = direction === 'x' ? current.mesh.position.x - prev.mesh.position.x : current.mesh.position.z - prev.mesh.position.z; 
                    const size = direction === 'x' ? current.w : current.d; 
                    const overlap = size - Math.abs(delta); 
                    
                    if (overlap <= 0) { 
                        gameActive = false; 
                        document.getElementById('score').style.color = '#ff0055'; 
                        document.getElementById('gameover-screen').style.display = 'flex';
                    } else { 
                        if (direction === 'x') { 
                            current.mesh.scale.x = overlap / current.w; 
                            current.mesh.position.x -= delta / 2; 
                            current.w = overlap; 
                        } else { 
                            current.mesh.scale.z = overlap / current.d; 
                            current.mesh.position.z -= delta / 2; 
                            current.d = overlap; 
                        } 
                        const finalScore = stack.length - 1; 
                        document.getElementById('score').innerText = finalScore; 
                        window.parent.enviarPontuacao('NEON_STACK', finalScore); 
                        speed += 0.01; 
                        spawn(); 
                    } 
                } 
                
                window.addEventListener('pointerdown', (e) => {
                    if(e.target.tagName === 'BUTTON') return;
                    action(e);
                }, { passive: true }); 

                window.reiniciarJogo = function() {
                    initGame();
                };

                window.sairDoJogo = function() {
                    if (animationFrameId) cancelAnimationFrame(animationFrameId);
                    window.parent.SHUTDOWN();
                };

                // Inicia o jogo pela primeira vez
                initGame();
                <\/script></body></html>
            `
        };

        function BOOT_GAME(id) {
            const viewport = document.getElementById('SISTEMA_VIEWPORT');
            const container = document.getElementById('SISTEMA_CONTAINER');
            viewport.style.display = 'block';
            
            const iframe = document.createElement('iframe');
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            
            container.innerHTML = "";
            container.appendChild(iframe);
            
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(SISTEMA_DE_ARQUIVOS[id]);
            doc.close();
        }

        function SHUTDOWN() {
            document.getElementById('SISTEMA_VIEWPORT').style.display = 'none';
            document.getElementById('SISTEMA_CONTAINER').innerHTML = '';
        }

        iniciarCliente();
    </script>
</body>
    </html>
